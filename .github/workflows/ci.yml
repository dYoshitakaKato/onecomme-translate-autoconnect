name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint:md
      - name: Generate version-ref lockfile for normalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          mkdir -p "$temp_root/.github/workflows" "$temp_root/bin"
          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' -o -name 'actions.lock' \) \
            -exec cp {} "$temp_root/.github/workflows/" \;
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-amd64 \
            --output "$temp_root/bin/gh-actions-lock"
          printf '%s  %s\n' 39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e "$temp_root/bin/gh-actions-lock" | sha256sum --check --strict
          chmod +x "$temp_root/bin/gh-actions-lock"
          export GH_ACTIONS_LOCK_REPO_ROOT="$temp_root"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          mapping = {
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1": "actions/checkout@v7.0.1",
              "actions/checkout@v7": "actions/checkout@v7.0.1",
              "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0": "actions/setup-python@v7.1.0",
              "actions/setup-python@v7": "actions/setup-python@v7.1.0",
              "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1": "actions/setup-node@v7.1.0",
              "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3": "actions/github-script@v9.0.0",
              "DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34": "DavidAnson/markdownlint-cli2-action@v25.0.0",
          }
          for path in (Path(os.environ["GH_ACTIONS_LOCK_REPO_ROOT"]) / ".github/workflows").iterdir():
              if path.suffix not in (".yml", ".yaml"):
                  continue
              text = path.read_text()
              for old, new in mapping.items():
                  text = re.sub(r"(?m)^(\s*(?:- )?uses: )" + re.escape(old) + r"(?: # v[0-9.]+)?$", lambda m: m[1] + new, text)
              path.write_text(text)
          PYTHON
          cd "$temp_root"
          "$temp_root/bin/gh-actions-lock" --no-interactive --no-narrow > "$temp_root/generate.log" 2>&1
          "$temp_root/bin/gh-actions-lock" --verify > "$temp_root/verify.log" 2>&1
          printf '%s\n' 'ACTIONS_LOCK_NORMALIZATION_BEGIN'
          cat .github/workflows/actions.lock
          printf '%s\n' 'ACTIONS_LOCK_NORMALIZATION_END'
          sha256sum .github/workflows/actions.lock
