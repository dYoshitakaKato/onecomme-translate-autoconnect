name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$install_dir/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$install_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan fetched Git history
        shell: bash
        run: |
          set -euo pipefail
          # Do not publish findings, source excerpts, or reports in logs/artifacts.
          # For local diagnosis: gitleaks git --redact=100 --log-opts="--all" .
          # Detection is advisory until explicitly made a required branch check.
          if gitleaks git --redact=100 --no-banner --log-opts="--all" . >/dev/null 2>&1; then
            echo "No secrets detected in fetched Git history."
          else
            echo "::error::Gitleaks detected a potential secret or could not complete the scan. Run the redacted scan locally to investigate; rotate confirmed exposed credentials."
            exit 1
          fi
