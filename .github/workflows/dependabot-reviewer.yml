name: Request Dependabot review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'dependabot/github_actions/') &&
          !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request review from repository owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: dYoshitakaKato
        run: |
          endpoint="repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers"
          reviewers="$(gh api "$endpoint" --jq '.users[].login')"
          if ! grep -Fxq -- "$REVIEWER" <<< "$reviewers"; then
            gh api --method POST "$endpoint" -f "reviewers[]=$REVIEWER" --silent
          fi
